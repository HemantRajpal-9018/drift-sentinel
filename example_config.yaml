# Drift Sentinel Example Configuration

detectors:
  - type: psi
    threshold: 0.2
    n_bins: 10
  - type: ks
    threshold: 0.05
  - type: jensen_shannon
    threshold: 0.1
  - type: chi_squared
    threshold: 0.05

# Optional: feature names for reporting
feature_names:
  - age
  - income
  - credit_score
  - loan_amount

