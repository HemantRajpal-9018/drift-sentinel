[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-sentinel"
version = "0.1.0"
description = "Lightweight ML model monitoring SDK for detecting data and concept drift"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Drift Sentinel Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["machine-learning", "monitoring", "drift-detection", "mlops", "data-drift"]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "matplotlib>=3.5.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
shap = ["shap>=0.41.0"]
api = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0"]
email = ["aiosmtplib>=2.0.0"]
all = [
    "shap>=0.41.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

[project.scripts]
drift-sentinel = "drift_sentinel.cli:cli"

[project.urls]
Homepage = "https://github.com/drift-sentinel/drift-sentinel"
Documentation = "https://drift-sentinel.readthedocs.io"
Repository = "https://github.com/drift-sentinel/drift-sentinel"
Issues = "https://github.com/drift-sentinel/drift-sentinel/issues"

[tool.setuptools.packages.find]
include = ["drift_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100
